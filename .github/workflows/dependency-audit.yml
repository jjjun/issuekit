name: Dependency audit

on:
  pull_request:
    paths:
      - ".github/workflows/dependency-audit.yml"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dependency-audit.yml"
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unlocked-install-smoke:
    name: unlocked install smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: |
          UV_TOOL_DIR="$RUNNER_TEMP/uv-tools" \
          UV_TOOL_BIN_DIR="$RUNNER_TEMP/uv-bin" \
            uv tool install --editable ".[mcp]"
      - run: |
          "$RUNNER_TEMP/uv-tools/issuekit/bin/python" \
            -c "from issuekit.mcp.server import create_server; create_server()"

  audit:
    name: pip-audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --all-extras --dev --locked
      - run: uv run pip-audit
      - run: |
          uv export --all-extras --dev --format requirements-txt --no-hashes --output-file requirements-audit.txt
          sed -i 's/ *;.*//' requirements-audit.txt
          echo "requirements in audit scope: $(grep -c '==' requirements-audit.txt)"
      - run: uv run pip-audit -r requirements-audit.txt --no-deps --disable-pip
