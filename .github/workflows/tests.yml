name: Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: lint, tests, and encoding
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --all-extras --dev --locked
      - run: uv run ruff check
      - run: ISSUEKIT_REQUIRE_MCP=1 uv run pytest
      - run: uv run issuekit check-encoding
      - run: uv run issuekit check-encoding --gate
