[project]
name = "issuekit"
version = "0.1.0"
description = "Shared API-backed issue handoff CLI and encoding guard"
authors = [
    { name = "jj", email = "11153631+jjjun@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0",
]

[dependency-groups]
dev = [
    "mcp>=1.0",
    "pip-audit>=2.9,<3",
    "pytest>=9.0.3,<10",
    "ruff>=0.16,<0.17",
]
mcp = [
    "mcp>=1.0",
]

[tool.uv]
constraint-dependencies = [
    "cryptography>=48.0.1",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
]

[tool.pytest.ini_options]
addopts = "-q"
markers = [
    "live_contract: live API contract checks that require explicit opt-in and a reachable issuekit backend",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RET"]
ignore = ["E501", "UP047"]

[project.scripts]
issuekit = "issuekit.cli:main"
issuekit-mcp = "issuekit.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["issuekit"]

# Per-repo overrides for the issue tracker. All keys are optional; defaults
# match the mine-js-monorepo reference implementation.
[tool.issuekit]
worker_accept_directed = true
# ascii_id_threshold = 0        # issue ids >= this value must be ASCII-only
# issues_dir = "docs/issues"
# api_url = "https://mine.example"
# project = "issuekit"
assignees = ["codex", "claude", "kimi"]
disabled_agents = ["kimi"]
default_reviewer = "auto"
work_branch = "main"
