[project]
name = "issuekit"
version = "0.1.0"
description = "Shared API-backed issue handoff CLI and encoding guard"
authors = [
    { name = "jj", email = "11153631+jjjun@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.2,<9",
]
mcp = [
    "mcp>=1.0",
]

[project.scripts]
issuekit = "issuekit.cli:main"
issuekit-mcp = "issuekit.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["issuekit"]

# Per-repo overrides for the issue tracker. All keys are optional; defaults
# match the mine-js-monorepo reference implementation.
[tool.issuekit]
# ascii_id_threshold = 0        # issue ids >= this value must be ASCII-only
# issues_dir = "docs/issues"
# api_url = "https://mine.example"
# project = "issuekit"
assignees = ["codex", "claude", "kimi"]
default_reviewer = "auto"
work_branch = "main"
